[project]
name = "ergou-services"
version = "0.1.0"
description = "Local video download service for Ergou"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "platformdirs>=4,<5",
  "yt-dlp[default]>=2026.1.1", "pywin32>=310; sys_platform == 'win32'"
]

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1",
  "trustme>=1.2,<2"
]

[project.scripts]
ergou = "ergou.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ergou"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
